# ===== Electron Builder 打包配置 =====

appId: com.lanchat.desktop
productName: LanChat
copyright: Copyright © 2026 LanChat

directories:
  output: release
  buildResources: build

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LanChat
  artifactName: "LanChat-Setup.${ext}"

extraResources:
  - from: node_modules/better-sqlite3/build
    to: better-sqlite3/build

asarUnpack:
  - '**/*.node'
  - '**/better-sqlite3/**'
  - '**/sharp/**'
