# ===== Electron Builder 打包配置 =====

appId: com.lanchat.desktop
productName: LanChat
copyright: Copyright © 2026 LanChat

directories:
  output: release
  buildResources: build

# 测试用：只生成绿色免安装文件夹（不做安装包，不签nsis）
win:
  target:
    - target: dir
      arch: [x64]

# 额外文件
extraResources:
  - from: node_modules/better-sqlite3/build
    to: better-sqlite3/build

asarUnpack:
  - '**/*.node'
  - '**/better-sqlite3/**'
  - '**/sharp/**'
