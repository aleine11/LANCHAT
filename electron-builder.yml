# ===== Electron Builder 打包配置 =====

appId: com.lanchat.desktop
productName: LanChat
copyright: Copyright © 2026 LanChat

directories:
  output: release
  buildResources: build

win:
  icon: build/icon.ico
  target:
    # 便携版：双击即可运行，无需安装
    - target: portable
      arch: [x64]
    # 安装包：标准 Windows 安装程序
    - target: nsis
      arch: [x64]

# NSIS 安装包也保留（体积更小，含卸载）
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LanChat
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  language: "2052"

# 跳过 electron-rebuild
npmRebuild: false

# 使用 extraResources 将图标复制到外部（避免被 asar 打包）
extraResources:
  - from: build
    to: build
    filter:
      - '**/*.ico'
      - '**/*.png'

# 只解压 .node 原生二进制文件
asarUnpack:
  - '**/*.node'

# 明确指定包含和排除的文件
files:
  # 包含必要的源代码
  - 'dist/**/*'
  - 'dist-electron/**/*'
  - 'package.json'
  - 'electron-builder.yml'
  # 包含必要的 node_modules 运行时
  - 'node_modules/**/*'
  # 排除所有打包产物
  - '!release/**/*'
  - '!release_final/**/*'
  - '!release_v2/**/*'
  - '!release1.1.0/**/*'
  # 排除编译临时文件
  - '!node_modules/better-sqlite3/build/**/*.tlog'
  - '!node_modules/better-sqlite3/build/**/*.obj'
  - '!node_modules/better-sqlite3/build/**/*.vcxproj'
  - '!node_modules/better-sqlite3/build/**/*.filters'
  - '!node_modules/better-sqlite3/build/**/*.recipe'
  - '!node_modules/better-sqlite3/build/**/*.lib'
  - '!node_modules/better-sqlite3/build/**/*.exp'
  - '!node_modules/better-sqlite3/build/**/*.sln'
  - '!node_modules/better-sqlite3/build/**/*.user'
  # 排除文档和 Git 相关
  - '!docs/**/*'
  - '!.git/**/*'
  - '!.gitignore'
  - '!README.md'
