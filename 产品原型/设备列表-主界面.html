<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LanChat - 设备列表</title>
<style>
  :root {
    --primary: #409EFF;
    --primary-light: #66B1FF;
    --primary-dark: #3A8EE6;
    --primary-bg: #ECF5FF;
    --bg-page: #F0F3F7;
    --bg-card: #FFFFFF;
    --text-primary: #303133;
    --text-regular: #606266;
    --text-secondary: #909399;
    --text-placeholder: #C0C4CC;
    --border-color: #EBEEF5;
    --border-radius: 14px;
    --box-shadow: 0 2px 16px rgba(0,0,0,0.07);
    --font-family: -apple-system, 'Microsoft YaHei', 'PingFang SC', sans-serif;
    --success: #67C23A;
    --danger: #F56C6C;
    --warning: #E6A23C;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-family);
    background: var(--bg-page);
    color: var(--text-primary);
    height: 100vh;
    display: flex;
    flex-direction: column;
    user-select: none;
  }
  /* === 标题栏 === */
  .titlebar {
    height: 42px;
    background: var(--primary);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    -webkit-app-region: drag;
    flex-shrink: 0;
  }
  .titlebar-left {
    display: flex;
    align-items: center;
    gap: 10px;
    color: white;
    font-size: 14px;
    font-weight: 600;
    -webkit-app-region: drag;
  }
  .titlebar-logo { width: 20px; height: 20px; background: rgba(255,255,255,0.25); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 12px; }
  .titlebar-right {
    display: flex; gap: 6px;
    -webkit-app-region: no-drag;
  }
  .titlebar-btn {
    width: 28px; height: 28px;
    border: none; background: none;
    color: rgba(255,255,255,0.85);
    font-size: 16px; cursor: pointer;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    text-decoration: none;
  }
  .titlebar-btn:hover { background: rgba(255,255,255,0.15); color: white; }
  .titlebar-btn.close:hover { background: #E81123; color: white; }
  /* === 内容区 === */
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 24px 28px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  /* === 我的设备卡片 === */
  .my-device-card {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    border-radius: var(--border-radius);
    padding: 20px 24px;
    color: white;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: 0 4px 20px rgba(64,158,255,0.3);
  }
  .my-avatar {
    width: 52px; height: 52px;
    background: rgba(255,255,255,0.2);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    flex-shrink: 0;
  }
  .my-info { flex: 1; }
  .my-name { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
  .my-ip { font-size: 13px; opacity: 0.85; font-family: 'Courier New', monospace; }
  .my-stats {
    display: flex; align-items: center; gap: 6px;
    margin-top: 6px; font-size: 13px; opacity: 0.9;
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%; background: #67C23A;
    animation: pulse 2s ease-in-out infinite;
    box-shadow: 0 0 6px rgba(103,194,58,0.5);
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(1.3); }
  }
  /* === 区域标题 === */
  .section-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 6px;
  }
  .section-title {
    font-size: 14px; font-weight: 600; color: var(--text-regular);
    display: flex; align-items: center; gap: 8px;
  }
  .section-count {
    font-size: 12px; color: var(--text-secondary);
    background: var(--border-color);
    padding: 2px 10px; border-radius: 10px;
  }
  .section-actions {
    display: flex; align-items: center; gap: 8px;
  }
  .refresh-btn {
    width: 28px; height: 28px;
    border: 1px solid var(--border-color);
    background: var(--bg-card);
    border-radius: 8px;
    font-size: 14px; cursor: pointer;
    color: var(--text-secondary);
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .refresh-btn:hover {
    background: var(--primary-bg);
    color: var(--primary);
    border-color: var(--primary-light);
  }
  .refresh-btn:active {
    transform: scale(0.9);
  }
  .refresh-btn.spinning {
    animation: spin 0.8s ease-in-out;
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  /* === 设备卡片网格 === */
  .device-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 14px;
  }
  .device-card {
    background: var(--bg-card);
    border-radius: var(--border-radius);
    padding: 20px;
    text-align: center;
    box-shadow: var(--box-shadow);
    cursor: pointer;
    transition: all 0.25s ease;
    border: 2px solid transparent;
    position: relative;
    text-decoration: none;
    color: var(--text-primary);
    display: block;
  }
  .device-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    border-color: var(--primary-light);
  }
  .device-card:active {
    transform: translateY(-1px);
  }
  .device-status {
    position: absolute;
    top: 12px; right: 12px;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 8px rgba(103,194,58,0.4);
    animation: pulse 2s ease-in-out infinite;
  }
  .device-icon {
    width: 56px; height: 56px;
    margin: 0 auto 12px;
    background: var(--primary-bg);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
  }
  .device-name {
    font-size: 15px; font-weight: 600;
    margin-bottom: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .device-ip {
    font-size: 12px; color: var(--text-secondary);
    font-family: 'Courier New', monospace;
    margin-bottom: 10px;
  }
  .device-action {
    display: inline-block;
    padding: 6px 18px;
    background: var(--primary-bg);
    color: var(--primary);
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.2s;
  }
  .device-card:hover .device-action {
    background: var(--primary);
    color: white;
  }
  /* === 最近联系人 === */
  .recent-list {
    display: flex; flex-direction: column; gap: 8px;
  }
  .recent-item {
    display: flex; align-items: center; gap: 12px;
    background: var(--bg-card);
    padding: 14px 16px;
    border-radius: 10px;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    transition: all 0.2s;
  }
  .recent-item:hover { background: var(--primary-bg); }
  .recent-avatar {
    width: 40px; height: 40px;
    background: #E8F4FD; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
  }
  .recent-info { flex: 1; min-width: 0; }
  .recent-name { font-size: 14px; font-weight: 600; }
  .recent-msg {
    font-size: 12px; color: var(--text-secondary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .recent-time { font-size: 11px; color: var(--text-placeholder); flex-shrink: 0; }
  .recent-badge {
    background: var(--danger); color: white;
    font-size: 11px; min-width: 18px; height: 18px;
    border-radius: 9px; display: flex; align-items: center; justify-content: center;
    padding: 0 5px;
  }
  /* === 滚动条 === */
  .content::-webkit-scrollbar { width: 5px; }
  .content::-webkit-scrollbar-track { background: transparent; }
  .content::-webkit-scrollbar-thumb { background: #d0d5dd; border-radius: 3px; }
  .content::-webkit-scrollbar-thumb:hover { background: #b0b5bd; }
</style>
</head>
<body>

<!-- 自定义标题栏 -->
<div class="titlebar">
  <div class="titlebar-left">
    <div class="titlebar-logo">💬</div>
    <span>LanChat</span>
  </div>
  <div class="titlebar-right">
    <a href="设置弹窗.html" class="titlebar-btn" title="设置">⚙</a>
    <button class="titlebar-btn" title="最小化">─</button>
    <button class="titlebar-btn close" title="关闭">✕</button>
  </div>
</div>

<!-- 主内容 -->
<div class="content">
  <!-- 我的设备信息卡片 -->
  <div class="my-device-card">
    <div class="my-avatar">🖥️</div>
    <div class="my-info">
      <div class="my-name">小明的台式电脑</div>
      <div class="my-ip">📡 192.168.1.5 : 5679</div>
      <div class="my-stats">
        <span class="status-dot"></span>
        <span>在线</span>
        <span style="margin-left:8px;">|</span>
        <span>已发现 <strong>3</strong> 台设备</span>
      </div>
    </div>
  </div>

  <!-- 最近联系人 -->
  <div>
    <div class="section-header">
      <span class="section-title">🕐 最近联系人</span>
    </div>
    <div class="recent-list">
      <a href="聊天窗口.html" class="recent-item">
        <div class="recent-avatar">💻</div>
        <div class="recent-info">
          <div class="recent-name">小红的笔记本</div>
          <div class="recent-msg">好的，我看看这个方案~</div>
        </div>
        <div class="recent-time">10:31</div>
        <span class="recent-badge">2</span>
      </a>
      <a href="聊天窗口.html" class="recent-item">
        <div class="recent-avatar">🖥️</div>
        <div class="recent-info">
          <div class="recent-name">办公室PC</div>
          <div class="recent-msg">[图片]</div>
        </div>
        <div class="recent-time">昨天</div>
      </a>
    </div>
  </div>

  <!-- 在线设备 -->
  <div>
    <div class="section-header">
      <span class="section-title">📡 在线设备</span>
      <div class="section-actions">
        <button class="refresh-btn" id="refreshBtn" title="刷新设备列表" onclick="refreshDevices()">🔄</button>
        <span class="section-count">3 台在线</span>
      </div>
    </div>
    <div class="device-grid">
      <!-- 设备1 -->
      <a href="聊天窗口.html" class="device-card">
        <span class="device-status"></span>
        <div class="device-icon">💻</div>
        <div class="device-name">小红的笔记本</div>
        <div class="device-ip">192.168.1.3</div>
        <span class="device-action">开始聊天</span>
      </a>
      <!-- 设备2 -->
      <a href="聊天窗口.html" class="device-card">
        <span class="device-status"></span>
        <div class="device-icon">🖥️</div>
        <div class="device-name">办公室PC</div>
        <div class="device-ip">192.168.1.8</div>
        <span class="device-action">开始聊天</span>
      </a>
      <!-- 设备3 -->
      <a href="聊天窗口.html" class="device-card">
        <span class="device-status"></span>
        <div class="device-icon">📱</div>
        <div class="device-name">会议室大屏</div>
        <div class="device-ip">192.168.1.10</div>
        <span class="device-action">开始聊天</span>
      </a>
    </div>
  </div>

  <div style="height: 16px;"></div>
</div>

<script>
  function refreshDevices() {
    var btn = document.getElementById('refreshBtn');
    // 旋转动画
    btn.classList.add('spinning');
    setTimeout(function() {
      btn.classList.remove('spinning');
    }, 800);
    // 模拟刷新：更新在线设备数（正式开发时会重新发送UDP广播扫描）
    var countEl = document.querySelector('.section-count');
    var originalText = countEl.textContent;
    countEl.textContent = '扫描中...';
    countEl.style.color = 'var(--primary)';
    setTimeout(function() {
      countEl.textContent = originalText;
      countEl.style.color = '';
    }, 1200);
  }
</script>

</body>
</html>
