<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LanChat - 图片预览</title>
<style>
  :root {
    --primary: #409EFF;
    --primary-dark: #3A8EE6;
    --bg-page: #F0F3F7;
    --text-primary: #303133;
    --text-regular: #606266;
    --text-secondary: #909399;
    --border-color: #EBEEF5;
    --font-family: -apple-system, 'Microsoft YaHei', 'PingFang SC', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-family);
    background: #0a0a0a;
    color: white;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .toolbar {
    position: fixed; top: 0; left: 0; right: 0;
    height: 48px;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(12px);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px;
    z-index: 10;
  }
  .toolbar-info {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px;
  }
  .toolbar-info .sender { color: #ccc; }
  .toolbar-info .time { color: #888; font-size: 12px; }
  .toolbar-actions { display: flex; gap: 8px; }
  .tool-btn {
    height: 32px; padding: 0 14px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08);
    color: white; border-radius: 6px;
    font-size: 13px; cursor: pointer;
    transition: 0.15s; font-family: inherit;
    display: flex; align-items: center; gap: 6px;
    text-decoration: none;
  }
  .tool-btn:hover { background: rgba(255,255,255,0.15); }
  .close-btn {
    width: 36px; height: 36px; border: none;
    background: rgba(255,255,255,0.1);
    color: white; border-radius: 8px;
    font-size: 18px; cursor: pointer;
    transition: 0.15s; display: flex; align-items: center; justify-content: center;
    text-decoration: none;
  }
  .close-btn:hover { background: rgba(255,100,100,0.4); }
  .image-container {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 60px 40px 40px; width: 100%;
  }
  .preview-image {
    max-width: 80vw; max-height: 70vh;
    border-radius: 12px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    object-fit: contain;
    transition: transform 0.3s;
    cursor: zoom-in;
  }
  .preview-image.zoomed {
    cursor: zoom-out;
    transform: scale(1.8);
  }
  .footer {
    height: 48px;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(12px);
    width: 100%;
    display: flex; align-items: center; justify-content: center;
    gap: 16px;
    font-size: 13px;
    color: #999;
    flex-shrink: 0;
  }
  .footer span { color: #ccc; }
  .tip-overlay {
    position: fixed; bottom: 60px;
    background: rgba(0,0,0,0.7);
    color: #ccc; padding: 8px 16px;
    border-radius: 6px; font-size: 12px;
    pointer-events: none;
    opacity: 0; transition: opacity 0.3s;
  }
  .tip-overlay.show { opacity: 1; }
</style>
</head>
<body>

<div class="toolbar">
  <div class="toolbar-info">
    <span>💻</span>
    <span class="sender">来自：小红的笔记本</span>
    <span class="time">2026-07-30 10:31</span>
  </div>
  <div class="toolbar-actions">
    <a href="聊天窗口.html" class="tool-btn">← 返回聊天</a>
    <button class="tool-btn" onclick="alert('模拟：保存图片到本地文件夹')">💾 保存</button>
    <a href="聊天窗口.html" class="close-btn">✕</a>
  </div>
</div>

<div class="image-container" id="imageContainer" onclick="toggleZoom()">
  <!-- 模拟图片：用渐变+文字代替 -->
  <div id="mockImage" class="preview-image" style="width:600px;height:400px;
    background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius:12px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;">
    <div style="font-size:60px;">🖼️</div>
    <div style="font-size:18px;font-weight:600;">界面原型.png</div>
    <div style="font-size:13px;opacity:0.7;">1920 × 1080 · 320 KB</div>
  </div>
</div>

<div class="tip-overlay" id="tip">点击图片放大/还原 | 滚轮缩放</div>

<div class="footer">
  <span>界面原型.png</span>
  <span>·</span>
  <span>1920 × 1080</span>
  <span>·</span>
  <span>320 KB</span>
  <span>·</span>
  <span>PNG</span>
</div>

<script>
  var mockImage = document.getElementById('mockImage');
  var tip = document.getElementById('tip');
  var zoomed = false;

  // Show tip on load
  setTimeout(function() { tip.classList.add('show'); }, 500);
  setTimeout(function() { tip.classList.remove('show'); }, 3000);

  function toggleZoom() {
    zoomed = !zoomed;
    if (zoomed) {
      mockImage.classList.add('zoomed');
    } else {
      mockImage.classList.remove('zoomed');
    }
  }

  // ESC to close
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      window.location.href = '聊天窗口.html';
    }
  });
</script>

</body>
</html>
